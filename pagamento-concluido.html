<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seu presente | Samuel & Lorena</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#fcfbf8;color:#0b1d35;font-family:Montserrat,sans-serif;padding:24px}.card{width:min(620px,100%);text-align:center;background:#fff;border:1px solid #e8dfd0;padding:70px 40px}.k{font-size:9px;letter-spacing:.24em;color:#b89658}.mark{font:500 30px "Cormorant Garamond",serif;margin-bottom:28px}.card h1{font:500 clamp(48px,8vw,76px) "Cormorant Garamond",serif;line-height:.95;margin:14px 0 22px}.card p{font-size:12px;line-height:1.8;color:#6f716f;max-width:440px;margin:0 auto 28px}.status{padding:14px;border-top:1px solid #eee8df;border-bottom:1px solid #eee8df;margin:28px 0;font-size:11px}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.actions a{padding:14px 20px;text-decoration:none;text-transform:uppercase;font-size:9px;letter-spacing:.14em;border:1px solid #0b1d35;color:#0b1d35}.actions a.primary{background:#0b1d35;color:#fff}@media(max-width:600px){.card{padding:52px 22px}}</style></head><body><main class="card"><div class="mark">S & L</div><div class="k">14 · 02 · 2027</div><h1>Obrigado pelo presente.</h1><p>Seu carinho faz parte do começo da nossa vida a dois.</p><div class="status" id="status">Verificando pagamento…</div><div class="actions"><a class="primary" href="/">Voltar ao convite</a><a id="receipt" href="#" target="_blank" rel="noopener" hidden>Ver comprovante</a></div></main><script>
(async()=>{const q=new URLSearchParams(location.search),status=document.getElementById("status"),receipt=document.getElementById("receipt");const order_nsu=q.get("order_nsu"),transaction_nsu=q.get("transaction_nsu"),slug=q.get("slug"),receipt_url=q.get("receipt_url");if(receipt_url){receipt.href=receipt_url;receipt.hidden=false}if(!order_nsu||!transaction_nsu||!slug){status.textContent="Retorno recebido. Consulte seu comprovante para os detalhes.";return}try{const r=await fetch("/api/payment-check",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({order_nsu,transaction_nsu,slug})}),d=await r.json();if(r.ok&&d.paid){status.textContent="Pagamento confirmado ✓";localStorage.removeItem("slGiftCart")}else status.textContent="Pagamento ainda não confirmado. Você pode verificar novamente em alguns instantes."}catch(e){status.textContent="Não foi possível verificar agora. Seu comprovante continua válido."}})();
</script></body></html>
