<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirmar presença | Samuel & Lorena</title><link rel="stylesheet" href="/styles.css?v=95"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet"></head><body class="confirmation-page">
<header class="confirmation-top"><a href="/" class="confirmation-brand">S <i>&</i> L</a><a href="/">← Voltar ao convite</a></header>
<main class="confirmation-shell"><section class="confirmation-intro"><p class="kicker">14 · 02 · 2027</p><h1>Confirme sua presença</h1><p>Será uma alegria celebrar esse dia com você.</p></section>
<section class="confirmation-card"><div class="signup-heading"><p class="kicker">RECEPÇÃO</p><h3>Quem vai participar?</h3><p>Informe os convidados que estarão conosco.</p></div><div id="rsvpDeadlineBox" hidden><span>CONFIRME ATÉ</span><strong id="rsvpDeadlineText"></strong><small id="rsvpDeadlineCountdown"></small></div>
<form id="rsvpForm"><label>Nome completo<input id="guestName" name="nome" required placeholder="Digite seu nome"></label><div class="two"><label>Adultos<select name="adultos" id="adultGuests" required><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option></select></label><label>Crianças até 10 anos<select name="criancas" id="childGuests"><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option></select></label></div><div id="guestSummary">Selecione os convidados.</div><label>Mensagem aos noivos <small>(opcional)</small><textarea id="guestMessage" name="mensagem" rows="3" placeholder="Escreva uma mensagem para nós"></textarea></label><button class="submit-rsvp" type="submit">Confirmar presença</button></form><div id="rsvpSuccess"></div></section></main>
<script src="/script.js?v=95"></script></body></html>
