<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Galeria privada | Samuel & Lorena</title><style>
:root{font-family:Arial,sans-serif;color:#152843;background:#f4f0e9}*{box-sizing:border-box}body{margin:0}header{background:#142743;color:#fff;padding:23px max(20px,calc((100vw - 1180px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px}header strong{font:normal 27px Georgia,serif}header a{color:#e3c796;font-size:13px}main{max-width:1180px;margin:35px auto;padding:0 20px}h1{font:normal clamp(30px,5vw,48px) Georgia,serif;margin:0 0 8px}p{line-height:1.6;color:#6c6d70}.panel{background:#fff;border:1px solid #ded2c0;padding:25px;margin:24px 0}input,select,button{font:inherit;padding:13px;border:1px solid #d4c8b8}input{width:100%;max-width:420px}button{background:#142743;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}.toolbar select{background:white}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:18px}.card{background:white;border:1px solid #e2d8c9;overflow:hidden}.card img{width:100%;height:210px;object-fit:contain;background:#eeeae4;cursor:zoom-in}.card .info{padding:15px}.card h3{font-size:14px;margin:0 0 7px;overflow-wrap:anywhere}.card small{color:#777}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:15px}.actions button{padding:9px 11px;font-size:12px;flex:1}.actions .reject{background:#fff;color:#813d3d;border-color:#c6a2a2}.pill{display:inline-block;font-size:11px;background:#eee8df;padding:4px 8px;margin:8px 0}.hidden,[hidden]{display:none!important}#viewer{position:fixed;inset:0;background:#000e;z-index:30;display:flex;align-items:center;justify-content:center;padding:25px}#viewer img{max-width:95vw;max-height:90vh;object-fit:contain}#viewer button{position:absolute;top:15px;right:20px;font-size:25px}#message{min-height:24px}@media(max-width:600px){header{padding:18px}main{margin:22px auto}.panel{padding:20px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card img{height:160px}.card .info{padding:10px}.actions button{width:100%}}</style></head><body><header><strong>S & L <span style="color:#c7a56c">|</span> Fotos</strong><a href="/">Voltar ao casamento</a></header><main><p style="letter-spacing:.2em;color:#a8885b;font-size:11px">ACESSO RESTRITO AOS NOIVOS</p><h1>Gerenciar fotografias</h1><p>Veja cada imagem antes de aprovar, excluir ou baixar. Clique na miniatura para ampliar a foto antes de decidir. Excluir remove a foto definitivamente.</p><section class="panel" id="loginPanel"><h2>Entrar</h2><form id="login"><input type="email" value="samilovtt@gmail.com" readonly aria-label="E-mail dos noivos"><input type="password" id="password" placeholder="Sua senha" autocomplete="current-password" required style="margin:10px 0"><button type="submit">Entrar no painel</button></form></section><section id="workspace" hidden><div class="toolbar"><label>Mostrar <select id="filter"><option value="pendente">Pendentes</option><option value="aprovada">Aprovadas</option><option value="rejeitada">Rejeitadas</option><option value="todas">Todas</option></select></label><button id="reload">Atualizar</button><button id="logout">Sair</button></div><p id="count"></p><div class="cards" id="cards"></div><div class="toolbar" style="margin-top:24px"><button id="prev">Anterior</button><span id="pageLabel"></span><button id="next">Próxima</button></div></section><p id="message" role="status"></p></main><div id="viewer" hidden role="dialog" aria-modal="true" aria-label="Visualizar foto"><button id="closeViewer" aria-label="Fechar foto">×</button><img id="viewerImage" alt="Foto ampliada"></div><script src="/admin-fotos.js" defer></script></body></html>
