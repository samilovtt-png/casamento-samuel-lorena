<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carrinho | Samuel & Lorena</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#faf7f1;color:#39433e;font-family:Montserrat,sans-serif}.nav{height:78px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 6vw;border-bottom:1px solid #e8e0d4}.nav a{text-decoration:none;color:inherit}.brand{font:600 25px "Cormorant Garamond",serif}.wrap{max-width:1100px;margin:auto;padding:70px 24px}.k{font-size:10px;letter-spacing:.25em;color:#9b825c}.wrap h1{font:500 55px "Cormorant Garamond",serif}.layout{display:grid;grid-template-columns:1.2fr .8fr;gap:35px}.items,.summary{background:#fff;border:1px solid #e5ddd1;padding:30px}.item{display:grid;grid-template-columns:1fr auto;gap:15px;padding:20px 0;border-bottom:1px solid #eee6da}.item h3{font:500 23px "Cormorant Garamond",serif;margin:0 0 7px}.controls{display:flex;gap:8px;align-items:center}.controls button{width:30px;height:30px;border:1px solid #cfc5b7;background:#fff}.remove{color:#8d665d;font-size:10px;cursor:pointer;margin-top:10px}.free{padding:8px;width:150px}.summary h2{font:500 32px "Cormorant Garamond",serif}.total{display:flex;justify-content:space-between;padding:20px 0;border-top:1px solid #ddd4c7}.qr{max-width:190px;margin:15px auto;display:block}.summary textarea{width:100%;height:85px;resize:none;padding:10px}.pay{width:100%;margin-top:12px;padding:15px;border:0;background:#667669;color:#fff;text-transform:uppercase;letter-spacing:.1em}.empty{text-align:center;padding:50px}@media(max-width:760px){.layout{grid-template-columns:1fr}.wrap h1{font-size:43px}}</style></head><body><nav class="nav"><a class="brand" href="/">S & L</a><a href="/#presentes">← Continuar escolhendo</a></nav><main class="wrap"><p class="k">LISTA DE PRESENTES</p><h1>Seu carrinho</h1><div class="layout"><section class="items" id="items"></section><aside class="summary"><p class="k">RESUMO</p><h2>Finalizar presente</h2><div class="total"><span>Total</span><strong id="total">R$ 0,00</strong></div><div style="display:flex;gap:8px;margin:15px 0"><button class="pay" style="margin:0;background:#26332f">Pix</button><button class="pay" id="infinitePay" style="margin:0">Cartão de crédito</button></div><p>Para Pix direto, use o QR Code abaixo. Para cartão, o pagamento será processado com segurança pela InfinitePay.</p><img class="qr" src="/assets/pix-qrcode.webp?v=24" alt="QR Code Pix"><textarea id="pix" readonly>00020126360014BR.GOV.BCB.PIX01145204000053039865802BR5923SAMUEL F LAUREANO LOPEZ6011HORTOLANDIA62070503***63041773</textarea><button class="pay" id="copy">Copiar Pix</button><button class="pay" id="finish">Concluir presente</button></aside></div></main><script>
const KEY="slGiftCart";let cart=[];try{cart=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){};const money=v=>v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});const price=x=>x.id==="livre"?Number(x.custom||0):Number(x.price||0);function save(){localStorage.setItem(KEY,JSON.stringify(cart));render()}function render(){const box=document.getElementById("items");box.innerHTML=cart.length?cart.map((x,i)=>'<div class="item"><div><h3>'+x.name+'</h3>'+(x.id==="livre"?'<input class="free" type="number" min="200" value="'+(x.custom||'')+'" data-free="'+i+'" placeholder="Mínimo R$ 200">':'<strong>'+money(price(x))+'</strong>')+'<div class="remove" data-remove="'+i+'">Remover</div></div><div class="controls"><button data-minus="'+i+'">−</button><span>'+(x.qty||1)+'</span><button data-plus="'+i+'">+</button></div></div>').join(""):'<div class="empty">Seu carrinho está vazio.<br><a href="/#presentes">Ver presentes</a></div>';document.getElementById("total").textContent=money(cart.reduce((t,x)=>t+price(x)*(x.qty||1),0));document.querySelectorAll("[data-plus]").forEach(b=>b.onclick=()=>{cart[+b.dataset.plus].qty++;save()});document.querySelectorAll("[data-minus]").forEach(b=>b.onclick=()=>{cart[+b.dataset.minus].qty=Math.max(1,cart[+b.dataset.minus].qty-1);save()});document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.remove,1);save()});document.querySelectorAll("[data-free]").forEach(i=>i.oninput=()=>{cart[+i.dataset.free].custom=Number(i.value||0);save()})}document.getElementById("infinitePay").onclick=async()=>{if(!cart.length)return alert("Adicione um presente primeiro.");const items=cart.map(x=>({quantity:x.qty||1,price:Math.round(price(x)*100),description:x.name}));if(items.some(x=>x.price<20000))return alert("O valor mínimo por presente é R$ 200,00.");const btn=document.getElementById("infinitePay");btn.disabled=true;btn.textContent="Abrindo pagamento...";try{const r=await fetch("/api/infinitepay",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({items})});const data=await r.json();if(!r.ok)throw new Error(data.error||"Não foi possível gerar o pagamento.");const url=data.url||data.checkout_url||data.link||data.payment_url;if(!url)throw new Error("A InfinitePay não retornou o link do checkout.");location.href=url}catch(e){alert(e.message);btn.disabled=false;btn.textContent="Cartão de crédito"}};document.getElementById("copy").onclick=async()=>{const p=document.getElementById("pix");try{await navigator.clipboard.writeText(p.value)}catch(e){p.select();document.execCommand("copy")}document.getElementById("copy").textContent="Pix copiado ✓"};document.getElementById("finish").onclick=()=>{if(!cart.length)return alert("Adicione um presente primeiro.");alert("Obrigado pelo presente! Após realizar o Pix, sua seleção pode ser concluída.");cart=[];save()};render();</script></body></html>
