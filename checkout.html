<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carrinho | Samuel & Lorena</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#fcfbf8;color:#0b1d35;font-family:Montserrat,sans-serif}.nav{height:72px;background:#fcfbf8;display:flex;align-items:center;justify-content:space-between;padding:0 6vw;border-bottom:1px solid #e8dfd0}.nav a{text-decoration:none;color:inherit}.brand{font:500 28px "Cormorant Garamond",serif}.nav>a:last-child{font-size:9px;letter-spacing:.12em;text-transform:uppercase}.wrap{max-width:1040px;margin:auto;padding:90px 24px 110px}.k{font-size:9px;letter-spacing:.25em;color:#b89658}.wrap>h1{font:500 clamp(52px,7vw,82px) "Cormorant Garamond",serif;margin:10px 0 48px}.layout{display:grid;grid-template-columns:1.15fr .85fr;gap:28px}.items,.summary{background:#fff;border:1px solid #e8dfd0;padding:34px}.item{display:grid;grid-template-columns:1fr auto;gap:15px;padding:22px 0;border-bottom:1px solid #eee8df}.item h3{font:500 25px "Cormorant Garamond",serif;margin:0 0 7px}.controls{display:flex;gap:8px;align-items:center}.controls button{width:30px;height:30px;border:1px solid #d9d0c3;background:#fff}.remove{color:#7c7067;font-size:9px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;margin-top:12px}.free{padding:10px;width:160px;border:1px solid #ddd4c7}.summary{position:sticky;top:24px;align-self:start}.summary h2{font:500 38px "Cormorant Garamond",serif;margin:8px 0 24px}.summary>p:not(.k){font-size:12px;line-height:1.7;color:#6f716f}.total{display:flex;justify-content:space-between;padding:20px 0;border-top:1px solid #e8dfd0;border-bottom:1px solid #e8dfd0}.qr{max-width:170px;margin:22px auto;display:block}.summary textarea{width:100%;height:64px;resize:none;padding:10px;border:1px solid #e8dfd0;font-size:9px}.pay{width:100%;margin-top:10px;padding:15px;border:1px solid #0b1d35;background:#0b1d35;color:#fff;text-transform:uppercase;letter-spacing:.12em;font-size:9px;cursor:pointer}.pay+ .pay{}.empty{text-align:center;padding:60px 10px;font-family:"Cormorant Garamond",serif;font-size:24px}.empty a{color:#0b1d35}@media(max-width:760px){.nav{height:64px;padding:0 20px}.wrap{padding:58px 18px 80px}.wrap>h1{font-size:54px;margin-bottom:32px}.layout{grid-template-columns:1fr}.items,.summary{padding:24px}.summary{position:static}.item h3{font-size:22px}}
</style></head><body><nav class="nav"><a class="brand" href="/">S & L</a><a href="/#presentes">← Continuar escolhendo</a></nav><main class="wrap"><p class="k">LISTA DE PRESENTES</p><h1>Seu presente</h1><div class="layout"><section class="items" id="items"></section><aside class="summary"><p class="k">RESUMO</p><h2>Finalizar presente</h2><div class="total"><span>Total</span><strong id="total">R$ 0,00</strong></div><div style="display:flex;gap:8px;margin:15px 0"><button class="pay" style="margin:0;background:#071a33">Pix</button><button class="pay" id="infinitePay" style="margin:0">Cartão de crédito</button></div><p>Escolha como deseja finalizar o seu presente.</p><img class="qr" src="/assets/pix-qrcode.webp?v=24" alt="QR Code Pix"><textarea id="pix" readonly>00020126360014BR.GOV.BCB.PIX01145204000053039865802BR5923SAMUEL F LAUREANO LOPEZ6011HORTOLANDIA62070503***63041773</textarea><button class="pay" id="copy">Copiar Pix</button><button class="pay" id="finish">Concluir presente</button></aside></div></main><script>
const KEY="slGiftCart";let cart=[];try{cart=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){};const money=v=>v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});const price=x=>x.id==="livre"?Number(x.custom||0):Number(x.price||0);function save(){localStorage.setItem(KEY,JSON.stringify(cart));render()}function render(){const box=document.getElementById("items");box.innerHTML=cart.length?cart.map((x,i)=>'<div class="item"><div><h3>'+x.name+'</h3>'+(x.id==="livre"?'<input class="free" type="number" min="1" value="'+(x.custom||'')+'" data-free="'+i+'" placeholder="Digite o valor">':'<strong>'+money(price(x))+'</strong>')+'<div class="remove" data-remove="'+i+'">Remover</div></div><div class="controls"><button data-minus="'+i+'">−</button><span>'+(x.qty||1)+'</span><button data-plus="'+i+'">+</button></div></div>').join(""):'<div class="empty">Seu carrinho está vazio.<br><a href="/#presentes">Ver presentes</a></div>';document.getElementById("total").textContent=money(cart.reduce((t,x)=>t+price(x)*(x.qty||1),0));document.querySelectorAll("[data-plus]").forEach(b=>b.onclick=()=>{cart[+b.dataset.plus].qty++;save()});document.querySelectorAll("[data-minus]").forEach(b=>b.onclick=()=>{cart[+b.dataset.minus].qty=Math.max(1,cart[+b.dataset.minus].qty-1);save()});document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.remove,1);save()});document.querySelectorAll("[data-free]").forEach(i=>i.oninput=()=>{cart[+i.dataset.free].custom=Number(i.value||0);save()})}document.getElementById("infinitePay").onclick=async()=>{if(!cart.length)return alert("Adicione um presente primeiro.");const items=cart.map(x=>({quantity:x.qty||1,price:Math.round(price(x)*100),description:x.name}));if(items.some(x=>x.price<=0))return alert("Digite um valor válido para o presente.");const btn=document.getElementById("infinitePay");btn.disabled=true;btn.textContent="Abrindo pagamento...";try{const r=await fetch("/api/infinitepay",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({items})});const data=await r.json();if(!r.ok)throw new Error(data.error||"Não foi possível gerar o pagamento.");const url=data.url||data.checkout_url||data.link||data.payment_url;if(!url)throw new Error("A InfinitePay não retornou o link do checkout.");location.href=url}catch(e){alert(e.message);btn.disabled=false;btn.textContent="Cartão de crédito"}};document.getElementById("copy").onclick=async()=>{const p=document.getElementById("pix");try{await navigator.clipboard.writeText(p.value)}catch(e){p.select();document.execCommand("copy")}document.getElementById("copy").textContent="Pix copiado ✓"};document.getElementById("finish").onclick=()=>{if(!cart.length)return alert("Adicione um presente primeiro.");alert("Obrigado pelo presente! Após realizar o Pix, sua seleção pode ser concluída.");cart=[];save()};render();</script></body></html>
